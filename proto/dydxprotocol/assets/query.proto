syntax = "proto3";
package dydxprotocol.assets;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "dydxprotocol/assets/asset.proto";
import "dydxprotocol/assets/asset_policy.proto";

option go_package = "github.com/dydxprotocol/v4-chain/protocol/x/assets/types";

// Query defines the gRPC querier service.
service Query {
  // Queries a Asset by id.
  rpc Asset(QueryAssetRequest) returns (QueryAssetResponse) {
    option (google.api.http).get = "/dydxprotocol/assets/asset/{id}";
  }

  // Queries a list of Asset items.
  rpc AllAssets(QueryAllAssetsRequest) returns (QueryAllAssetsResponse) {
    option (google.api.http).get = "/dydxprotocol/assets/asset";
  }

  // Queries an AssetPolicy by asset id.
  rpc AssetPolicy(QueryAssetPolicyRequest) returns (QueryAssetPolicyResponse) {
    option (google.api.http).get =
        "/dydxprotocol/assets/asset_policy/{asset_id}";
  }

  // Queries all AssetPolicy items.
  rpc AllAssetPolicies(QueryAllAssetPoliciesRequest)
      returns (QueryAllAssetPoliciesResponse) {
    option (google.api.http).get = "/dydxprotocol/assets/asset_policy";
  }
}

// Queries an Asset by id.
message QueryAssetRequest { uint32 id = 1; }

// QueryAssetResponse is response type for the Asset RPC method.
message QueryAssetResponse { Asset asset = 1 [ (gogoproto.nullable) = false ]; }

// Queries a list of Asset items.
message QueryAllAssetsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryAllAssetsResponse is response type for the AllAssets RPC method.
message QueryAllAssetsResponse {
  repeated Asset asset = 1 [ (gogoproto.nullable) = false ];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryAssetPolicyRequest queries an AssetPolicy by asset id.
message QueryAssetPolicyRequest { uint32 asset_id = 1; }

// QueryAssetPolicyResponse is the response for the AssetPolicy RPC.
message QueryAssetPolicyResponse {
  AssetPolicy policy = 1 [ (gogoproto.nullable) = false ];
}

// QueryAllAssetPoliciesRequest queries all asset policies.
message QueryAllAssetPoliciesRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryAllAssetPoliciesResponse contains all requested asset policies.
message QueryAllAssetPoliciesResponse {
  repeated AssetPolicy policies = 1 [ (gogoproto.nullable) = false ];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}
