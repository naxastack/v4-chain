syntax = "proto3";
package dydxprotocol.assets;

option go_package = "github.com/dydxprotocol/v4-chain/protocol/x/assets/types";

// AssetPolicyStatus defines the lifecycle state of an asset policy.
enum AssetPolicyStatus {
  // Unspecified is not a valid persisted policy state.
  ASSET_POLICY_STATUS_UNSPECIFIED = 0;
  // Active permits operations enabled by the policy flags.
  ASSET_POLICY_STATUS_ACTIVE = 1;
  // Paused blocks new deposits and trading while preserving withdrawals.
  ASSET_POLICY_STATUS_PAUSED = 2;
  // Retired permanently blocks new deposits and trading while preserving
  // withdrawals.
  ASSET_POLICY_STATUS_RETIRED = 3;
}

// AssetPolicy defines the mutable business permissions for an asset.
message AssetPolicy {
  // AssetId identifies the immutable Asset governed by this policy.
  uint32 asset_id = 1;
  // Status is the lifecycle state of the policy.
  AssetPolicyStatus status = 2;
  // DepositsEnabled permits new bank-to-funding deposits while active.
  bool deposits_enabled = 3;
  // WithdrawalsEnabled permits funding-to-bank withdrawals.
  bool withdrawals_enabled = 4;
  // SpotTradingEnabled permits spot transfers, orders, and fills while active.
  bool spot_trading_enabled = 5;
  // PerpetualEnabled permits use by existing perpetual asset paths.
  bool perpetual_enabled = 6;
}

// AssetPolicyState stores the consensus versions for one asset policy.
// Submitters cannot set these versions on AssetPolicy.
message AssetPolicyState {
  // AssetId identifies the asset whose policy versions are stored.
  uint32 asset_id = 1;
  // PolicyVersion increments on every successful policy change.
  uint64 policy_version = 2;
  // LifecycleVersion increments only when the policy status changes.
  uint64 lifecycle_version = 3;
}

// AssetLifecycleTask is the asset-owned schedule for Spot pair transitions.
message AssetLifecycleTask {
  // AssetId identifies the asset that owns this task.
  uint32 asset_id = 1;
  // TargetLifecycleVersion must match AssetPolicyState.lifecycle_version.
  uint64 target_lifecycle_version = 2;
  // TargetStatus is the asset status this task applies to Spot pairs.
  AssetPolicyStatus target_status = 3;
  // NextClobPairId is the next Spot pair id for this asset.
  uint32 next_clob_pair_id = 4;
  // Completed reports that every referenced Spot pair has been visited.
  bool completed = 5;
}

// AssetLifecycleSchedulerCursor is the next asset id to service.
message AssetLifecycleSchedulerCursor {
  // NextAssetId is the first asset considered in the next block.
  uint32 next_asset_id = 1;
}
